name: Сборка APK

on:
  push:
    branches: [main, master]
    # Игры собираются раздельно: правки «Морского боя» не трогают эту сборку.
    paths-ignore:
      - 'seabattle/**'
      - 'monopoly/**'
      - '.github/workflows/seabattle.yml'
      - 'share/**'
    tags: ['v*']
  pull_request:
    branches: [main, master]
    paths-ignore:
      - 'seabattle/**'
      - 'monopoly/**'
  workflow_dispatch:
    inputs:
      release_notes:
        description: 'Что нового в этой сборке'
        required: false
        default: 'Ручная сборка'

permissions:
  contents: write

jobs:
  build:
    name: Собрать APK
    runs-on: ubuntu-latest

    steps:
      - name: Забрать код
        uses: actions/checkout@v4

      - name: Поставить Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Установить зависимости
        run: npm ci

      - name: Проверить типы
        run: npx tsc -b --force

      - name: Собрать веб-часть
        run: npx vite build

      - name: Поставить JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Поставить Android SDK
        uses: android-actions/setup-android@v3

      - name: Перенести сборку в Android-проект
        run: npx cap sync android

      # Условие смотрит прямо в секреты: `env` здесь ненадёжен — переменная
      # объявлена в этом же шаге, и на момент проверки её может ещё не быть,
      # а тогда ключ молча не подставится и сборка выйдет с отладочной подписью.
      - name: Распаковать ключ подписи
        if: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: Определить версию
        id: version
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF#refs/tags/v}"
          else
            VERSION="1.0.$GITHUB_RUN_NUMBER"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "BUILD_VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "BUILD_NUMBER=$GITHUB_RUN_NUMBER" >> "$GITHUB_ENV"

      - name: Собрать release APK
        working-directory: android
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          chmod +x ./gradlew
          ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Переименовать APK
        run: |
          mkdir -p out
          cp android/app/build/outputs/apk/release/app-release*.apk \
             "out/dilemma-${{ steps.version.outputs.version }}.apk"
          ls -lh out

      # Отладочная подпись не даёт поставить обновление поверх прежней версии,
      # поэтому релиз с ней публиковать нельзя — лучше уронить сборку.
      - name: Проверить подпись
        run: |
          APK=$(ls out/*.apk | head -1)
          OWNER=$(keytool -printcert -jarfile "$APK" | grep -m1 'Owner:' || echo 'Owner: неизвестно')
          echo "Подписано: $OWNER"
          if echo "$OWNER" | grep -q 'Android Debug'; then
            echo "::warning::APK подписан отладочным ключом — обновление не встанет поверх"
            if [[ "$GITHUB_REF" == refs/tags/* ]]; then
              echo "::error::Релизный тег с отладочной подписью — проверьте секреты ANDROID_*"
              exit 1
            fi
          fi

      - name: Приложить APK к запуску
        uses: actions/upload-artifact@v4
        with:
          name: dilemma-apk-${{ steps.version.outputs.version }}
          path: out/*.apk
          retention-days: 90

      - name: Опубликовать релиз
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: out/*.apk
          name: Дилемма заключённого ${{ steps.version.outputs.version }}
          body: |
            APK для Android 6.0 и новее.

            Скачайте файл ниже, разрешите установку из неизвестных источников
            и откройте его на телефоне.

            Для игры по Wi-Fi всем участникам нужна одна и та же сеть.
          generate_release_notes: true
