name: Сборка APK — Монополия

on:
  push:
    branches: [main, master]
    paths:
      - 'monopoly/**'
      - '.github/workflows/monopoly.yml'
    tags: ['mono-v*']
  pull_request:
    branches: [main, master]
    paths:
      - 'monopoly/**'
  workflow_dispatch:

permissions:
  contents: write

defaults:
  run:
    working-directory: monopoly

jobs:
  build:
    name: Собрать APK
    runs-on: ubuntu-latest

    env:
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}

    steps:
      - name: Забрать код
        uses: actions/checkout@v4

      - name: Поставить Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: monopoly/package-lock.json

      - name: Установить зависимости
        run: npm ci

      - name: Проверить типы
        run: npx tsc -b --force

      - name: Собрать веб-часть
        run: npx vite build

      - name: Поставить JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Поставить Android SDK
        uses: android-actions/setup-android@v3

      - name: Перенести сборку в Android-проект
        run: npx cap sync android

      # Ключ берётся из переменной уровня задачи: в `if` у шага контекста
      # `secrets` нет вовсе, а собственный `env` шага на момент проверки
      # условия ещё не применён. Работает только объявление уровнем выше.
      - name: Распаковать ключ подписи
        if: ${{ env.ANDROID_KEYSTORE_BASE64 != '' }}
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: Определить версию
        id: version
        run: |
          if [[ "$GITHUB_REF" == refs/tags/mono-v* ]]; then
            VERSION="${GITHUB_REF#refs/tags/mono-v}"
          else
            VERSION="1.0.$GITHUB_RUN_NUMBER"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "BUILD_VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "BUILD_NUMBER=$GITHUB_RUN_NUMBER" >> "$GITHUB_ENV"

      - name: Собрать release APK
        working-directory: monopoly/android
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          chmod +x ./gradlew
          ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Переименовать APK
        run: |
          mkdir -p out
          cp android/app/build/outputs/apk/release/app-release*.apk \
             "out/monopoly-${{ steps.version.outputs.version }}.apk"
          ls -lh out

      # Отладочная подпись не даёт поставить обновление поверх прежней версии,
      # поэтому релиз с ней публиковать нельзя — лучше уронить сборку.
      - name: Проверить подпись
        run: |
          APK=$(ls out/*.apk | head -1)
          OWNER=$(keytool -printcert -jarfile "$APK" | grep -m1 'Owner:' || echo 'Owner: неизвестно')
          echo "Подписано: $OWNER"
          if echo "$OWNER" | grep -q 'Android Debug'; then
            echo "::warning::APK подписан отладочным ключом — обновление не встанет поверх"
            if [[ "$GITHUB_REF" == refs/tags/* ]]; then
              echo "::error::Релизный тег с отладочной подписью — проверьте секреты ANDROID_*"
              exit 1
            fi
          fi

      - name: Приложить APK к запуску
        uses: actions/upload-artifact@v4
        with:
          name: monopoly-apk-${{ steps.version.outputs.version }}
          path: monopoly/out/*.apk
          retention-days: 90

      - name: Опубликовать релиз
        if: startsWith(github.ref, 'refs/tags/mono-v')
        uses: softprops/action-gh-release@v2
        with:
          files: monopoly/out/*.apk
          name: Монополия ${{ steps.version.outputs.version }}
          # Отметку «latest» держит «Дилемма заключённого»: на неё
          # ведёт напечатанный QR-код, и он не должен переключиться.
          make_latest: false
          body: |
            APK для Android 6.0 и новее.

            Скачайте файл ниже, разрешите установку из неизвестных источников
            и откройте его на телефоне.

            Для игры по Wi-Fi всем участникам нужна одна и та же сеть:
            один телефон открывает стол, остальные подключаются к нему.
          generate_release_notes: true
